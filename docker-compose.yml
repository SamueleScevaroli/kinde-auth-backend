services:
  database:
    container_name: 'kinde-postgres'
    image: 'postgres:16'
    ports:
      - '5432:5432'
    environment:
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_DB=general'
      - 'POSTGRES_PASSWORD=postgres'
    volumes:
      - '~/volumes/general/postgres:/var/lib/postgresql/data'